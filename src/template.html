<style>

  --fg:var(--on-bg); --fg2:var(--on-bg-2); --rule:var(--on-bg-3); --fill:var(--tray); --lk:var(--link-on-bg); --pri-bg:#ffffff; --pri-fg:#092e47;
}
.card,.sheet,.pat,.doc,.am,.pane>.stack:not(.hd),.pane>.scroll-x,.pane>.q,.page-in>.stack:not(.hd),.page-in>.scroll-x{

.sheet,.pane>.stack:not(.hd),.pane>.scroll-x,.pane>.q,.page-in>.stack:not(.hd),.page-in>.scroll-x{background:var(--card);border-radius:7px;box-shadow:var(--neu);padding:14px 16px}

var NEXT={lead:"The steps above are the method behind the four examples on this site. The next version is being built a different way, and it will be measured against a test set before it replaces this one.",why:"A plain request to the same model, with no pattern library, found points on some measures that the step-by-step method missed. The method also sometimes forced a known pattern onto wording where it did not matter. Both reviews are combined in the examples here, and both observations are the reason for the change.",agent:"The tool is moving from a fixed list of steps to an agent: a reviewer that decides for itself what to read, what to research and what to check again, with the pattern library as a reference it can consult and not a checklist it must apply.",evalIntro:"Each version of the agent is scored on the same test set, and a change is kept only when the score improves by more than the normal variation between runs. The test set is built this way:",evalPoints:["Each test starts from a documented loophole in a real law, with its source.","The loophole is rewritten into a new bill on a different subject, so the test measures reasoning and not memory of a well-known case.","Each test has a twin: the same bill with the loophole closed. Flagging the closed gap counts against the tool.","Credit requires the mechanism: the exact words or the named absence, who could use it and how, and why that defeats the stated purpose of the bill. A matching keyword is not enough.","A loophole that is found but rated as minor when it is serious earns partial credit.","Some tests are held back and never used while the tool is being adjusted. They are used only to confirm that a gain is real."],status:"This work is in progress. The test set and the scoring are built. No results are reported here yet, and the examples on this site were made with the method above."};

  if(!open)return h+"</article>";

  if(q.length)h+='<div class="quote">'+q.map(function(x){return"\u201c"+esc(x)+"\u201d"}).join(" \u00b7 ")+"</div>";

var ERR={not_granted:"Access to the analysis service was not allowed for this page, so a full analysis cannot run.",rate_limited:"The analysis service is busy right now. Try again later.",session_expired:"Your session has ended. Sign in again, then retry.",refused:"The analysis service declined this request.",prompt_too_large:"The text is too long for one pass. Try a shorter measure or one title at a time.",invalid_json:"The reply could not be read as structured data. Try again.",cancelled:"Stopped."};

function ctxFor(m,f){return"MEASURE: "+m.analysis.short+" ("+m.analysis.cite+")\n\nTEXT:\n"+m.text.blocks.map(function(b){return b.text}).join("\n")+(f?"\n\nFINDING: "+f.title+"\n"+f.plain+"\n"+(f.tech||""):"")}

  var st=S.ask[id]={q:q,busy:true};render();
  sample(ctxFor(m,f)+"\n\nA reader asks about this finding: "+q+"\n\nAnswer in plain language in under 150 words. Describe what the wording permits; do not speculate about anyone's motives. If the answer depends on facts outside the text that you cannot verify here, say so. Do not use em dashes.",{cache:false}).then(function(r){st.a=r.text},function(e){st.a=errMsg(e)}).then(function(){st.busy=false;render()})}
function testGoal(){var m=cur(),inp=el("goal-in"),q=inp?inp.value.trim():"";if(!q||!sample)return;var st=S.goal[m.analysis.id]={q:q,busy:true};render();
